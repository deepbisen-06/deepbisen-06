<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="342" viewBox="0 0 1200 342" role="img" aria-labelledby="about-life-title"><title id="about-life-title">About Me — Deep Bisen</title><defs><linearGradient id="about-life-bg" x2="1" y2="1"><stop stop-color="#020a13"/><stop offset=".6" stop-color="#061321"/><stop offset="1" stop-color="#100a19"/></linearGradient><linearGradient id="about-life-accent"><stop stop-color="#00c8ff"/><stop offset=".55" stop-color="#247bff"/><stop offset="1" stop-color="#ff354f"/></linearGradient><pattern id="about-life-dots" width="15" height="15" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".8" fill="#1b7cb6" opacity=".3"/></pattern><filter id="about-life-glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4"/></filter><style>text{font-family:Arial,Helvetica,sans-serif;fill:#edf4ff}.title{font-size:32px;font-weight:700}.name{font-size:83px;font-weight:900;letter-spacing:-3px}.card{font-size:26px;font-weight:700}.body{font-size:22px;fill:#b7c8df}.small{font-size:18px;fill:#a6bad4}.label{font-size:15px;font-family:monospace;letter-spacing:2px;fill:#43c9ff}.mono{font:18px monospace;fill:#9fb8d4}.enter{animation:enter .9s ease-out both}.swing{transform-origin:600px 76px;animation:swing 7s ease-in-out infinite}.light{animation:light 4s ease-in-out infinite}@keyframes enter{from{opacity:1;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes swing{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}@keyframes light{50%{opacity:.35}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect x="2" y="2" width="1196" height="338" rx="18" fill="url(#about-life-bg)" stroke="#14577b"/><rect x="2" y="2" width="1196" height="338" rx="18" fill="url(#about-life-dots)"/><path d="M28 26V57" stroke="#00c8ff" stroke-width="5" stroke-linecap="round"/><text x="46" y="51" class="title">About Me</text><rect x="26" y="80" width="368" height="237" rx="14" fill="#071421" stroke="#00c8ff"/><text x="48" y="115" class="label" style="fill:#00c8ff">ROBOTICS</text><text x="48" y="159" class="card" style="fill:#00c8ff">Robotics &amp; ROS 2</text><text x="48" y="202" class="small">Learning and building robotic</text><text x="48" y="233" class="small">systems with ROS 2, control</text><text x="48" y="264" class="small">and navigation experiments.</text><rect x="420" y="80" width="368" height="237" rx="14" fill="#071421" stroke="#a568ff"/><text x="442" y="115" class="label" style="fill:#a568ff">INTELLIGENCE</text><text x="442" y="159" class="card" style="fill:#a568ff">AI / Machine Learning</text><text x="442" y="202" class="small">Exploring machine learning,</text><text x="442" y="233" class="small">simulation and AI-assisted</text><text x="442" y="264" class="small">analytics with Python.</text><rect x="814" y="80" width="368" height="237" rx="14" fill="#071421" stroke="#ff354f"/><text x="836" y="115" class="label" style="fill:#ff354f">HARDWARE</text><text x="836" y="159" class="card" style="fill:#ff354f">Embedded &amp; Prototyping</text><text x="836" y="202" class="small">Working with ESP8266, motors,</text><text x="836" y="233" class="small">drivers and web controls to</text><text x="836" y="264" class="small">build practical robotic systems.</text></svg>